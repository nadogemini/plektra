      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Mandarin pinyin dictionary (rime-ice, GPL-3.0)
        run: |
          git init -q /tmp/rime-ice
          git -C /tmp/rime-ice fetch -q --depth 1 https://github.com/iDvel/rime-ice.git "$RIME_ICE_COMMIT"
          git -C /tmp/rime-ice checkout -q FETCH_HEAD
          mkdir -p app/src/main/assets/pinyin
          python tools/personal/build_pinyin_dict.py /tmp/rime-ice/cn_dicts app/src/main/assets/pinyin/pinyin_dict.txt 100
          cp /tmp/rime-ice/LICENSE app/src/main/assets/pinyin/LICENSE-rime-ice.txt
          ls -la app/src/main/assets/pinyin

      - name: Check the model decodes Vietnamese (same settings as the app)
        run: |
          python -m pip install --quiet numpy "sherpa-onnx==${SHERPA_VERSION}" || python -m pip install --quiet numpy sherpa-onnx
          python - <<'PY'
          import glob, os, time, wave
          import numpy as np
          import sherpa_onnx
          d = "app/src/main/assets/asr-vi"
          rec = sherpa_onnx.OfflineRecognizer.from_transducer(
              encoder=f"{d}/encoder.int8.onnx", decoder=f"{d}/decoder.onnx",
              joiner=f"{d}/joiner.int8.onnx", tokens=f"{d}/tokens.txt",
              num_threads=4, sample_rate=16000, feature_dim=80,
              decoding_method="modified_beam_search", max_active_paths=4)
          wavs = sorted(glob.glob(f"/tmp/{os.environ['ASR_MODEL']}/test_wavs/*.wav"))
          assert wavs, "no test wavs"
          for path in wavs:
              with wave.open(path) as w:
                  rate = w.getframerate()
                  pcm = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16)
              samples = np.concatenate([pcm.astype(np.float32) / 32768.0, np.zeros(rate * 3 // 10, np.float32)])
              s = rec.create_stream()
              s.accept_waveform(rate, samples)
              t = time.time()
              rec.decode_stream(s)
              text = s.result.text.strip().lower()
              print(f"{os.path.basename(path)} ({len(pcm)/rate:.1f}s, {time.time()-t:.2f}s): {text}")
              assert text, "empty transcript"
          PY

      - name: Run Telex and pinyin unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.telex.VietnameseTelexProcessorTest --tests rocks.pkb.plektra.inputmethod.pinyin.PinyinEngineTest

      - name: Build debug APK
        run: ./gradlew :app:assembleStableDebug

      - name: Check APK contents
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
          unzip -l out/*.apk | grep -E "asr-vi/|libsherpa-onnx-jni|libonnxruntime"
          unzip -l out/*.apk | grep -E "asr-vi/encoder.int8.onnx"
          unzip -l out/*.apk | grep -E "lib/arm64-v8a/libsherpa-onnx-jni.so"
          unzip -l out/*.apk | grep -E "assets/pinyin/pinyin_dict.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plektra-telex-fix
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "telex-fix-${{ github.run_number }}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Personal build: Vietnamese Telex + offline voice (#${{ github.run_number }})" \
            --notes "Unofficial personal debug build of Plektra: reworked Vietnamese Telex, no empty keyboard strip, hold Space for offline Vietnamese dictation (tap Space to stop), Mandarin pinyin input (sherpa-onnx, Zipformer-vi 30M). Not an official Plektra release. See PERSONAL_BUILD.md on the personal-build branch."
