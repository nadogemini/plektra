name: Personal build (Vietnamese Telex fix)

on:
  workflow_dispatch:
  push:
    branches: [personal-build]
    paths-ignore: ["**.md"]

permissions:
  contents: write

env:
  SHERPA_VERSION: "1.13.8"
  SHERPA_AAR_SHA256: "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96"
  ASR_MODEL: "sherpa-onnx-zipformer-vi-30M-int8-2026-02-09"
  RIME_ICE_COMMIT: "927e1cf1d3eeb9bf4be85e3f684dba4dd485b6f6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply personal patch
        run: |
          cat $(ls personal/patch.part* | sort -V) | base64 -d | gunzip > /tmp/personal.patch
          git apply --stat /tmp/personal.patch
          git apply /tmp/personal.patch

      - name: Add sherpa-onnx (on-device speech engine)
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          echo "${SHERPA_AAR_SHA256}  app/libs/sherpa-onnx.aar" | sha256sum -c -
          unzip -l app/libs/sherpa-onnx.aar | grep -E "arm64-v8a|classes.jar"

      - name: Add Vietnamese speech model
        run: |
          curl -fsSL -o /tmp/model.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${ASR_MODEL}.tar.bz2"
          tar -xjf /tmp/model.tar.bz2 -C /tmp
          mkdir -p app/src/main/assets/asr-vi
          for f in encoder.int8.onnx decoder.onnx joiner.int8.onnx tokens.txt; do
            cp "/tmp/${ASR_MODEL}/$f" app/src/main/assets/asr-vi/
          done
          sha256sum app/src/main/assets/asr-vi/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Mandarin pinyin dictionary (rime-ice, GPL-3.0)
        run: |
          git init -q /tmp/rime-ice
          git -C /tmp/rime-ice fetch -q --depth 1 https://github.com/iDvel/rime-ice.git "$RIME_ICE_COMMIT"
          git -C /tmp/rime-ice checkout -q FETCH_HEAD
          mkdir -p app/src/main/assets/pinyin
          python tools/personal/build_pinyin_dict.py /tmp/rime-ice/cn_dicts app/src/main/assets/pinyin/pinyin_dict.txt 100
          cp /tmp/rime-ice/LICENSE app/src/main/assets/pinyin/LICENSE-rime-ice.txt
          ls -la app/src/main/assets/pinyin

      - name: Run Telex and pinyin unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.telex.VietnameseTelexProcessorTest --tests rocks.pkb.plektra.inputmethod.pinyin.PinyinEngineTest

      - name: Build debug APK
        run: ./gradlew :app:assembleStableDebug

      - name: Check APK contents
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
          unzip -l out/*.apk | grep -E "asr-vi/|libsherpa-onnx-jni|libonnxruntime"
          unzip -l out/*.apk | grep -E "asr-vi/encoder.int8.onnx"
          unzip -l out/*.apk | grep -E "lib/arm64-v8a/libsherpa-onnx-jni.so"
          unzip -l out/*.apk | grep -E "assets/pinyin/pinyin_dict.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plektra-telex-fix
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "telex-fix-${{ github.run_number }}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Personal build: Vietnamese Telex + offline voice (#${{ github.run_number }})" \
            --notes "Unofficial personal debug build of Plektra: reworked Vietnamese Telex, no empty keyboard strip, hold Space for offline Vietnamese dictation (tap Space to stop), Mandarin pinyin input (sherpa-onnx, Zipformer-vi 30M). Not an official Plektra release. See PERSONAL_BUILD.md on the personal-build branch."
