name: Personal build (Vietnamese Telex fix)

on:
  workflow_dispatch:
  push:
    branches: [personal-build]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply Vietnamese Telex engine
        run: |
          f=app/src/main/java/rocks/pkb/plektra/inputmethod/telex/VietnameseTelexProcessor.kt
          echo "997f63e3737f1e671e3c1b19eac0d38db081528f5158e8e7777d7a83ea742bc7  $f" | sha256sum -c -
          echo "" | base64 -d | gunzip > "$f"
          python3 - <<'PY'
          p = "app/src/test/java/rocks/pkb/plektra/inputmethod/telex/VietnameseTelexProcessorTest.kt"
          s = open(p, encoding="utf-8").read()
          pairs = [
              ("(\"tuo\", 'w', \"tươ\")", "(\"tuo\", 'w', \"tuơ\")"),
              ("(\"thuy\", 's', \"thuý\")", "(\"thuy\", 's', \"thúy\")"),
          ]
          for old, new in pairs:
              assert old in s, old
              s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          PY
          git diff --stat

      - name: Run Telex unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.telex.VietnameseTelexProcessorTest

      - name: Build debug APK
        run: ./gradlew :app:assembleStableDebug

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plektra-telex-fix
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "telex-fix-${{ github.run_number }}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Personal build: Vietnamese Telex fix (#${{ github.run_number }})" \
            --notes "Unofficial personal debug build of Plektra with a reworked Vietnamese Telex engine. Not an official Plektra release. See PERSONAL_BUILD.md on the personal-build branch."
